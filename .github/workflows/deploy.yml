name: Deploy Campaign Manager

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SERVER_HOST: ${{ secrets.DEPLOY_HOST }}
          SERVER_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          test -n "$SSH_KEY" || { echo "DEPLOY_SSH_KEY is empty"; exit 1; }
          test -n "$SERVER_HOST" || { echo "DEPLOY_HOST is empty"; exit 1; }
          SSH_DIR="$HOME/.ssh"
          mkdir -p "$SSH_DIR"
          chmod 700 "$SSH_DIR"
          printf '%s\n' "$SSH_KEY" > "$SSH_DIR/deploy_key"
          chmod 600 "$SSH_DIR/deploy_key"
          ssh-keyscan -T 10 -p "${SERVER_PORT:-9011}" "$SERVER_HOST" >> "$SSH_DIR/known_hosts"

      - name: Upload source
        env:
          SERVER_HOST: ${{ secrets.DEPLOY_HOST }}
          SERVER_USER: ${{ secrets.DEPLOY_USER }}
          SERVER_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          tar --exclude=.git --exclude=node_modules --exclude='*/node_modules' \
              --exclude=.next --exclude='*/.next' --exclude=.env \
              --exclude='*/.env' --exclude=test-results \
              -czf /tmp/campain-manager.tar.gz .
          scp -i ~/.ssh/deploy_key -P "${SERVER_PORT:-9011}" \
              /tmp/campain-manager.tar.gz \
              "${SERVER_USER:-root}@${SERVER_HOST}:/tmp/campain-manager.tar.gz"

      - name: Install and restart production services
        env:
          SERVER_HOST: ${{ secrets.DEPLOY_HOST }}
          SERVER_USER: ${{ secrets.DEPLOY_USER }}
          SERVER_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${SERVER_PORT:-9011}" \
            "${SERVER_USER:-root}@${SERVER_HOST}" 'bash -s' <<'REMOTE'
          set -e
          APP_DIR=/var/www/campain-manager
          mkdir -p "$APP_DIR"
          test -f "$APP_DIR/apps/api/.env" || { echo "Missing $APP_DIR/apps/api/.env"; exit 1; }
          tar -xzf /tmp/campain-manager.tar.gz -C "$APP_DIR"
          rm -f /tmp/campain-manager.tar.gz
          cd "$APP_DIR"
          npm config set registry https://registry.npmjs.org/
          find . -name package-lock.json -type f -exec sed -i \
            's#https://mirror-npm.runflare.com/#https://registry.npmjs.org/#g' {} +
          npm install --no-audit --no-fund
          npm install --prefix apps/api --no-audit --no-fund
          npm install --prefix apps/web --no-audit --no-fund
          npm --prefix apps/api run prisma:generate
          cd apps/api
          npx prisma migrate deploy
          cd ../..
          npm --prefix apps/api run prisma:seed
          npm run build:api
          npm run build:web

          # Keep this application in its own Nginx vhost.  Without an exact
          # server_name, requests for this subdomain can fall through to the
          # default vhost (for example auto-channel.ir).
          install -d -m 755 /etc/nginx/sites-available /etc/nginx/sites-enabled
          cat > /etc/nginx/sites-available/campain-manager <<'NGINX'
          server {
              listen 80;
              server_name campain.auto-channel.ir;
              return 301 https://$host$request_uri;
          }

          server {
              listen 443 ssl http2;
              server_name campain.auto-channel.ir;

              ssl_certificate /etc/letsencrypt/live/auto-channel.ir/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/auto-channel.ir/privkey.pem;
              client_max_body_size 50m;

              location /api/ {
                  proxy_pass http://127.0.0.1:4001;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto https;
              }

              location / {
                  proxy_pass http://127.0.0.1:3000;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_set_header Host $host;
                  proxy_set_header X-Forwarded-Proto https;
                  proxy_cache_bypass $http_upgrade;
              }
          }
          NGINX
          ln -sfn /etc/nginx/sites-available/campain-manager /etc/nginx/sites-enabled/campain-manager
          nginx -t
          systemctl reload nginx
          systemctl daemon-reload
          systemctl restart campain-manager-api
          systemctl restart campain-manager-web
          API_HEALTH_URL="http://127.0.0.1:${API_PORT:-4001}/health"
          for attempt in $(seq 1 30); do
            if curl -fsS "$API_HEALTH_URL"; then
              echo
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "API did not become healthy: $API_HEALTH_URL" >&2
              systemctl status campain-manager-api --no-pager -l || true
              exit 1
            fi
            sleep 2
          done
          echo "DEPLOY OK"
          REMOTE
